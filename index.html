<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lamp &amp; Path: Bible &amp; Prayer</title>
  <meta name="description" content="The full King James Bible with highlights and notes, reading plans, Scripture memory, a devotional journal, daily Bible games and a prayer journal.">
  <meta name="theme-color" content="#1a1330">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lamp &amp; Path">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#lamp"/></svg>
      <span>Lamp <em>&amp;</em> Path</span>
    </div>
    <nav class="tabs" aria-label="Main">
      <button class="tab" data-view="daily"><span class="ti">☀️</span><span>Daily</span></button>
      <button class="tab" data-view="bible"><span class="ti">📜</span><span>Bible</span></button>
      <button class="tab" data-view="prayer"><span class="ti">🙏</span><span>Prayer</span></button>
      <button class="tab" data-view="grow"><span class="ti">🌱</span><span>Grow</span></button>
    </nav>
    <button class="icon-btn settings-btn" id="settingsBtn" title="Personalize, install and share" aria-label="Personalize, install and share">⚙️</button>
    <button class="profile" id="profileBtn" aria-label="Profile and progress">
      <span class="lvl" id="lvl">1</span>
      <span class="pinfo">
        <span class="ptitle" id="lvlTitle">Seeker</span>
        <span class="xpbar"><i id="xpfill"></i></span>
      </span>
      <span class="streak">🔥<b id="streak">0</b></span>
    </button>
  </header>

  <main>

    <section id="view-bible" class="view"><div class="bible-page" id="biblePage"></div></section>
    <section id="view-daily" class="view scroll"><div class="page" id="dailyPage"></div></section>
    <section id="view-grow" class="view scroll"><div class="page" id="growPage"></div></section>
    <section id="view-prayer" class="view scroll"><div class="page" id="prayerPage"></div></section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button class="close" data-close aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="lampGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#c8862e"/></linearGradient>
      <radialGradient id="lampFlame" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#fff8d0"/><stop offset=".5" stop-color="#ffb43a"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/></radialGradient>
      <symbol id="lamp" viewBox="0 0 64 64">
        <circle cx="44" cy="20" r="16" fill="url(#lampFlame)"/>
        <path d="M44 6c4 6 6 9 6 13a6 6 0 0 1-12 0c0-4 2-7 6-13z" fill="#ffcf5a"/>
        <path d="M44 12c2 4 3 6 3 8a3 3 0 0 1-6 0c0-2 1-4 3-8z" fill="#fff6d0"/>
        <path d="M6 36c0-4 8-7 22-7s22 2 24 6l-6 4c-2 7-10 11-20 11S10 46 8 41C6 40 6 38 6 36z" fill="url(#lampGold)"/>
        <path d="M46 35l8-6c1 0 2 1 1 2l-5 6z" fill="#e3a447"/>
        <ellipse cx="28" cy="33" rx="12" ry="3" fill="#8a5a22" opacity=".6"/>
        <rect x="20" y="50" width="16" height="4" rx="2" fill="#b0702a"/>
      </symbol>
    </defs>
  </svg>

  <script src="js/data/journey.js"></script>
  <script src="js/data/library.js"></script>
  <script src="js/data/grow.js"></script>
  <script src="js/data/overviews.js"></script>
  <script src="js/data/places.js"></script>
  <script src="js/data/map.js"></script>
  <script src="js/core.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/orig.js"></script>
  <script src="js/study.js"></script>
  <script src="js/ambient.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/alarm.js"></script>
  <script src="js/requests.js"></script>
  <script src="js/praylist.js"></script>
  <script src="js/personal.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/fast.js"></script>
  <script src="js/grow.js"></script>
  <script src="js/connect.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
